<!--Use internet while viewing this page, this contain cdn icons and please download image from image folder-->
<!doctype html>
<html>
  <head>
    <title>Registration Form</title>
    <script
      src="https://kit.fontawesome.com/c6b9d65cc4.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="RegistrationForm2.css" />
  </head>
  <body>
    <div class="hero">
      <div class="form-div">
        <form>
          <h4>Please provide us your Feedback....!!</h4>
          <div class="input-group">
            <input type="text" name="name" id="name" required />
            <label for="name"><i class="fas fa-user"></i>Name</label>
          </div>
          <div class="input-group">
            <input type="text" id="email" required />
            <label for="email"><i class="fas fa-envelope"></i>Email</label>
          </div>
          <div class="input-group">
            <input type="text" id="mobile" required />
            <label for="mobile"><i class="fas fa-mobile"></i>Mobile</label>
          </div>
          <div class="input-group">
            <textarea rows="8" id="messages" required></textarea>
            <label for="messages"
              ><i class="fas fa-comment-dots"></i>Message</label
            >
          </div>
          <button type="submit">
            Submit<i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
